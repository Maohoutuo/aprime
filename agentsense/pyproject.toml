[project]
name = "agentsense"
version = "0.1.0"
description = "Reproduction harness for AgentSense (arXiv:2510.19661v2): environment, baselines and multi-agent refinement."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentsense = "agentsense.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentsense*"]
