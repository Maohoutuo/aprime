[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapus"
version = "0.1.0"
description = "Reproduction of MAPUS: Language-Grounded Multi-Agent Planning for Personalized and Fair Participatory Urban Sensing (arXiv:2603.24014v1)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "agentsense>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["mapus*"]
